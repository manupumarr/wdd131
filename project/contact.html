<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Store | Custom Sublimation & Printing</title>
    <meta name="description" content="Infinite Store offers high-quality sublimation, DTF, and screen printing services for t-shirts, uniforms, and personalized gifts in Zulia.">
    <meta name="author" content="Manuel Pumar">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="images/logo.jpg" alt="Infinite Store Logo" width="80" height="80">
            <span>Infinite Store</span>
        </div>
        <a id="menu" href="#"></a> <nav>
            <ul class="navigation">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="products.html">Catalog</a></li>
                <li><a href="contact.html">Get a Quote</a></li>
                <li><a href="siteplan.html">Site Plan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Request a Quote</h1>
            <p>Fill out this form and we will get back to you with a personalized budget.</p>
            
            <form method="get" action="thanks.html" class="quote-form">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="fname">Full Name <span class="required">*</span></label>
                    <input type="text" id="fname" name="fname" required placeholder="Enter your name">

                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com">
                </fieldset>

                <fieldset>
                    <legend>Order Details</legend>
                    <label for="product-type">Product of Interest <span class="required">*</span></label>
                    <select id="product-type" name="product-type" required>
                        <option value="" disabled selected>Select a product...</option>
                        <option value="tshirt">Custom T-Shirts</option>
                        <option value="mug">Sublimated Mugs</option>
                        <option value="merch">Merchandising (Keychains/Mousepads)</option>
                        <option value="other">Other</option>
                    </select>

                    <label>Urgency Level:</label>
                    <div class="radio-group">
                        <input type="radio" id="low" name="urgency" value="low">
                        <label for="low">Normal (5-7 days)</label>
                        <input type="radio" id="high" name="urgency" value="high">
                        <label for="high">Urgent (24-48 hours)</label>
                    </div>

                    <label for="comments">Extra details or quantities:</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Tell us more about your design..."></textarea>
                </fieldset>

                <input type="submit" value="Send Request" class="submit-btn">
            </form>

            <div id="submission-status" class="status-msg"></div>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> • Infinite Store • Manuel Pumar</p>
        <p>Zulia, Venezuela</p>
        <p><a href="reference.html" style="color: var(--secondary-color);">Image References</a></p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - Infinite Store</title>
    <meta name="description" content="Comparte tu experiencia con los productos personalizados de Infinite Store. Tu reseña sobre nuestra calidad de sublimación nos ayuda a mejorar.">
    <meta name="author" content="Manuel Pumar">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">&#9733;&#9733;&#9733;&#9733;&#9733;</label>
                    
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">&#9733;&#9733;&#9733;&#9733;&#9734;</label>
                    
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">&#9733;&#9733;&#9733;&#9734;&#9734;</label>
                    
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">&#9733;&#9733;&#9734;&#9734;&#9734;</label>
                    
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">&#9733;&#9734;&#9734;&#9734;&#9734;</label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <div class="checkbox-group">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    <label for="durability">Durability</label>

                    <input type="checkbox" id="design" name="features" value="design">
                    <label for="design">Design</label>

                    <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">
                    <label for="easeOfUse">Ease of Use</label>

                    <input type="checkbox" id="performance" name="features" value="performance">
                    <label for="performance">Performance</label>
                </div>
            </fieldset>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName" placeholder="e.g. Manuel Pumar">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> • Manuel Pumar • Zulia, Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - Infinite Store</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <label><input type="radio" name="rating" value="5" required> &#9733;&#9733;&#9733;&#9733;&#9733;</label>
                    <label><input type="radio" name="rating" value="4"> &#9733;&#9733;&#9733;&#9733;&#9734;</label>
                    <label><input type="radio" name="rating" value="3"> &#9733;&#9733;&#9733;&#9734;&#9734;</label>
                    <label><input type="radio" name="rating" value="2"> &#9733;&#9733;&#9734;&#9734;&#9734;</label>
                    <label><input type="radio" name="rating" value="1"> &#9733;&#9734;&#9734;&#9734;&#9734;</label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <label><input type="checkbox" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" name="features" value="design"> Design</label>
                <label><input type="checkbox" name="features" value="easeOfUse"> Ease of Use</label>
                <label><input type="checkbox" name="features" value="performance"> Performance</label>
            </fieldset>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName" placeholder="e.g. Manuel Pumar">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> • Manuel Pumar • Zulia, Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
